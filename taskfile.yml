# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

dotenv: ['.env']

includes:
  zig: taskfiles/zig.yml

env:
  VENV_DIR: "{{.ROOT_DIR}}/.venv"
  PATH: "{{.VENV_DIR}}/bin:{{.PATH}}"

vars:
  TARGET_EXEC: zelda3
  SDL2_VERSION: "2.32.10"
  CC: '{{.CC | default "cc"}}'
  CFLAGS: '{{.CFLAGS | default "-O2 -Werror"}}'
  SOURCES:
    sh: |
      # util.c, config.c, poly.c, tile_detect.c, input.c, cart.c and apu.c are
      # ported to Zig (src/util.zig, src/config.zig, src/poly.zig,
      # src/tile_detect.zig, snes/input.zig, snes/cart.zig, snes/apu.zig);
      # util_strfmt.c keeps the C-variadic StrFmt in C. The Zig sides are
      # compiled by the compile-zig-* tasks.
      { find src snes -maxdepth 1 -name '*.c' ! -name 'util.c' ! -name 'config.c' ! -name 'poly.c' ! -name 'tile_detect.c' ! -name 'input.c' ! -name 'cart.c' ! -name 'apu.c'; \
        echo third_party/gl_core/gl_core_3_1.c; \
        echo third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c; } | sort

tasks:
  default:
    desc: "Default task"
    cmds:
      - task --list

  _step:
    internal: true
    desc: "Log MSG, then run CMD (shared by assets, link-res)"
    cmds:
      - echo "{{.MSG}}"
      - "{{.CMD}}"

  build:
    desc: Compile and link the zelda3 binary
    deps:
      - task: compile
        for: { var: SOURCES, as: SRC }
        vars: { SRC: '{{.SRC}}' }
      - compile-zig-util
      - compile-zig-config
      - compile-zig-poly
      - compile-zig-tile_detect
      - compile-zig-input
      - compile-zig-cart
      - compile-zig-apu
    vars:
      OBJS:
        sh: echo '{{.SOURCES}}' | sed 's/\.c/.o/g' | tr '\n' ' '
    sources:
      - "src/*.o"
      - "snes/*.o"
      - "third_party/gl_core/*.o"
      - "third_party/opus-1.3.1-stripped/*.o"
    generates:
      - "{{.TARGET_EXEC}}{{if eq OS \"windows\"}}.exe{{end}}"
    cmds:
      - task: link-res
      - >-
        {{.CC}} {{.OBJS}} src/util.o src/config.o src/poly.o src/tile_detect.o snes/input.o snes/cart.o snes/apu.o
        {{if eq OS "windows"}}zelda3.res{{end}}
        -o {{.TARGET_EXEC}} {{.LDFLAGS}}
        {{if eq OS "windows"}}-Wl,-Bstatic $(sdl2-config --static-libs){{else}}$(sdl2-config --libs) -lm{{end}}

  compile-zig-config:
    internal: true
    label: compile-zig-config
    desc: Compile src/config.zig to src/config.o (the ported half of config.c) for the C link
    sources: ['src/config.zig', 'src/types.zig']
    generates: ['src/config.o']
    cmds:
      - >-
        zig build-obj -O ReleaseFast -lc
        -femit-bin=src/config.o src/config.zig

  compile-zig-poly:
    internal: true
    label: compile-zig-poly
    desc: Compile src/poly.zig to src/poly.o (the ported half of poly.c) for the C link
    sources: ['src/poly.zig', 'src/types.zig', 'src/variables.zig']
    generates: ['src/poly.o']
    cmds:
      - >-
        zig build-obj -O ReleaseFast -lc
        -femit-bin=src/poly.o src/poly.zig

  compile-zig-tile_detect:
    internal: true
    label: compile-zig-tile_detect
    desc: Compile src/tile_detect.zig to src/tile_detect.o (the ported half of tile_detect.c) for the C link
    sources: ['src/tile_detect.zig', 'src/types.zig', 'src/variables.zig']
    generates: ['src/tile_detect.o']
    cmds:
      - >-
        zig build-obj -O ReleaseFast -lc
        -femit-bin=src/tile_detect.o src/tile_detect.zig

  compile-zig-input:
    internal: true
    label: compile-zig-input
    desc: Compile snes/input.zig to snes/input.o (the ported half of snes/input.c) for the C link
    sources: ['snes/input.zig']
    generates: ['snes/input.o']
    cmds:
      - >-
        zig build-obj -O ReleaseFast -lc
        -femit-bin=snes/input.o snes/input.zig

  compile-zig-cart:
    internal: true
    label: compile-zig-cart
    desc: Compile snes/cart.zig to snes/cart.o (the ported half of snes/cart.c) for the C link
    sources: ['snes/cart.zig']
    generates: ['snes/cart.o']
    cmds:
      - >-
        zig build-obj -O ReleaseFast -lc
        -femit-bin=snes/cart.o snes/cart.zig

  compile-zig-apu:
    internal: true
    label: compile-zig-apu
    desc: Compile snes/apu.zig to snes/apu.o (the ported half of snes/apu.c) for the C link
    sources: ['snes/apu.zig']
    generates: ['snes/apu.o']
    cmds:
      - >-
        zig build-obj -O ReleaseFast -lc
        -femit-bin=snes/apu.o snes/apu.zig

  compile-zig-util:
    internal: true
    label: compile-zig-util
    desc: Compile src/util.zig to src/util.o (the ported half of util.c) for the C link
    sources: ['src/util.zig', 'src/types.zig']
    generates: ['src/util.o']
    cmds:
      - >-
        zig build-obj -O ReleaseFast -lc
        -femit-bin=src/util.o src/util.zig

  compile:
    internal: true
    label: 'compile-{{.SRC}}'
    sources: ['{{.SRC}}']
    generates: ['{{trimSuffix ".c" .SRC}}.o']
    cmds:
      - >-
        {{.CC}} -c {{.CFLAGS}} -I .
        $(sdl2-config --cflags) -DSYSTEM_VOLUME_MIXER_AVAILABLE=0
        {{.SRC}} -o {{trimSuffix ".c" .SRC}}.o

  prek:
    desc: Run prek (pre-commit) hooks against the full tree
    cmds:
      - prek run --all-files

  install:
    desc: Install SDL2 for the current OS
    cmds:
      - task: install:darwin
      - task: install:linux

  playtest:linux:
    desc: Install headless-Wayland playtest tooling (sway + wtype + grim) for driving zelda3 headlessly on Linux
    platforms: [linux]
    cmds:
      - task: _step
        vars:
          MSG: "Installing headless-Wayland playtest tooling (sway + wtype + grim)"
          CMD: |
            set -e
            # Idempotent: skip anything already on PATH (packaged or previously source-built).
            need_sway=$(command -v sway >/dev/null 2>&1 && echo no || echo yes)
            need_wtype=$(command -v wtype >/dev/null 2>&1 && echo no || echo yes)
            need_grim=$(command -v grim >/dev/null 2>&1 && echo no || echo yes)
            if [ "$need_sway" = no ] && [ "$need_wtype" = no ] && [ "$need_grim" = no ]; then
              echo "sway, wtype, and grim already installed; nothing to do."
              exit 0
            fi

            if command -v apt >/dev/null 2>&1; then
              pkgs=""
              [ "$need_sway" = yes ] && pkgs="$pkgs sway"
              [ "$need_wtype" = yes ] && pkgs="$pkgs wtype"
              [ "$need_grim" = yes ] && pkgs="$pkgs grim"
              sudo apt install -y $pkgs
            elif command -v pacman >/dev/null 2>&1; then
              pkgs=""
              [ "$need_sway" = yes ] && pkgs="$pkgs sway"
              [ "$need_wtype" = yes ] && pkgs="$pkgs wtype"
              [ "$need_grim" = yes ] && pkgs="$pkgs grim"
              sudo pacman -S --noconfirm --needed $pkgs
            elif command -v dnf >/dev/null 2>&1; then
              # EL10/Fedora: none of these are packaged for EL10, so build from source into /usr/local.
              sudo dnf install -y epel-release || true
              sudo dnf install -y \
                git meson ninja-build cmake gcc gcc-c++ scdoc pkgconf-pkg-config \
                wlroots-devel json-c-devel cairo-devel pango-devel gdk-pixbuf2-devel \
                libevdev-devel libinput-devel pixman-devel libpng-devel \
                wayland-devel wayland-protocols-devel libxkbcommon-devel
              WORK=$(mktemp -d)
              build_meson() {
                name=$1; url=$2; branch=$3; shift 3
                echo "Building $name from source"
                git clone --branch "$branch" --depth 1 "$url" "$WORK/$name"
                ( cd "$WORK/$name" \
                  && meson setup build --prefix=/usr/local "$@" \
                  && ninja -C build \
                  && sudo ninja -C build install )
              }
              if [ "$need_sway" = yes ]; then
                build_meson sway https://github.com/swaywm/sway.git v1.10.1 \
                  -Dtray=disabled -Dwerror=false -Dman-pages=disabled
              fi
              if [ "$need_wtype" = yes ]; then
                build_meson wtype https://github.com/atx/wtype.git master
              fi
              if [ "$need_grim" = yes ]; then
                build_meson grim https://github.com/emersion/grim.git v1.4.1
              fi
              sudo ldconfig
              rm -rf "$WORK"
            else
              echo "Unsupported Linux distro: install sway, wtype, and grim manually" >&2
              exit 1
            fi

  playtest:macos:
    desc: Verify macOS playtest tooling (osascript + screencapture, both built-in) and required privacy permissions
    platforms: [darwin]
    cmds:
      - task: _step
        vars:
          MSG: "Checking macOS playtest tooling (osascript + screencapture)"
          CMD: |
            # osascript (System Events key injection) and screencapture (-x screenshots) ship with macOS;
            # nothing to install. This task just verifies they're present and reminds about the one
            # non-programmatic step: the driving terminal needs Accessibility + Screen Recording grants.
            missing=0
            for b in osascript screencapture; do
              if command -v "$b" >/dev/null 2>&1; then
                echo "  $b: $(command -v "$b")"
              else
                echo "  $b: MISSING (expected a built-in macOS tool)" >&2
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] || exit 1
            echo "Grant your terminal app Accessibility + Screen Recording in"
            echo "System Settings > Privacy & Security so osascript/screencapture can drive zelda3."

  install:darwin:
    internal: true
    platforms: [darwin]
    status:
      - command -v sdl2-config >/dev/null 2>&1
    cmds:
      - task: _step
        vars:
          MSG: "Installing SDL2 (Homebrew)"
          CMD: "brew install sdl2"

  install:linux:
    internal: true
    platforms: [linux]
    status:
      - command -v sdl2-config >/dev/null 2>&1
    cmds:
      - task: _step
        vars:
          MSG: "Installing SDL2"
          CMD: |
            if command -v apt >/dev/null 2>&1; then
              sudo apt install -y libsdl2-dev
            elif command -v dnf >/dev/null 2>&1; then
              if grep -qi '^ID=fedora' /etc/os-release; then
                sudo dnf install -y SDL2-devel
              else
                sudo dnf install -y epel-release
                if ! sudo dnf install -y SDL2-devel; then
                  echo "SDL2-devel unavailable via dnf/EPEL; building SDL2 {{.SDL2_VERSION}} from source"
                  sudo dnf install -y gcc gcc-c++ make cmake git \
                    alsa-lib-devel pulseaudio-libs-devel \
                    libX11-devel libXext-devel libXrandr-devel libXcursor-devel \
                    libXi-devel libXfixes-devel libXinerama-devel libXScrnSaver-devel \
                    mesa-libGL-devel mesa-libEGL-devel \
                    wayland-devel wayland-protocols-devel libxkbcommon-devel
                  SRC_DIR=$(mktemp -d)
                  git clone --branch release-{{.SDL2_VERSION}} --depth 1 https://github.com/libsdl-org/SDL.git "$SRC_DIR"
                  ( cd "$SRC_DIR" && ./configure --prefix=/usr/local && make -j"$(nproc)" && sudo make install )
                  sudo ldconfig
                  rm -rf "$SRC_DIR"
                fi
              fi
            elif command -v pacman >/dev/null 2>&1; then
              sudo pacman -S --noconfirm sdl2
            else
              echo "Unsupported Linux distro: install libsdl2-dev manually" >&2
              exit 1
            fi

  link-res:
    internal: true
    platforms: [windows]
    desc: Generate the Windows resource file
    sources:
      - src/platform/win32/zelda3.rc
    generates:
      - zelda3.res
    cmds:
      - task: _step
        vars:
          MSG: "Generating Windows resources"
          CMD: "windres src/platform/win32/zelda3.rc -O coff -o zelda3.res"

  assets:
    desc: Extract game resources from the ROM into zelda3_assets.dat
    sources:
      - zelda3.sfc
    generates:
      - zelda3_assets.dat
    cmds:
      - task: _step
        vars:
          MSG: "Extracting game resources"
          CMD: "uv run assets/restool.py --extract-from-rom"

  clean:
    desc: Remove object files, binary, and generated assets
    cmds:
      - task: clean:obj
      - task: clean:gen

  clean:obj:
    desc: Remove object files and the compiled binary
    cmds:
      - rm -f src/*.o src/util.o src/config.o src/tile_detect.o snes/*.o snes/input.o snes/cart.o snes/apu.o third_party/gl_core/*.o third_party/opus-1.3.1-stripped/*.o zelda3.res {{.TARGET_EXEC}}

  clean:gen:
    desc: Remove generated assets and extracted tables
    cmds:
      - rm -f zelda3_assets.dat tables/zelda3_assets.dat tables/*.txt tables/*.png tables/sprites/*.png tables/*.yaml
      - rm -rf tables/__pycache__ tables/dungeon tables/img tables/overworld tables/sound
